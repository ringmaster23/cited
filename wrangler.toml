# Cloudflare Workers + Static Assets configuration
# https://developers.cloudflare.com/workers/static-assets/

name = "cited"
compatibility_date = "2024-09-23"
main = "worker.js"

[assets]
directory = "dist"
binding = "ASSETS"
# run_worker_first = true means every request goes through worker.js before
# static-asset routing, which is required for Accept: text/markdown
# content negotiation on the same URL as the HTML page.
run_worker_first = true

[build]
# build.js copies repo → dist/, then indexnow-submit.js pushes the sitemap
# URL list to Bing via IndexNow so every deploy auto-notifies the search index.
command = "node build.js && node scripts/indexnow-submit.js"
