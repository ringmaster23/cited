# Cloudflare Workers + Static Assets configuration
# https://developers.cloudflare.com/workers/static-assets/

name = "cited"
compatibility_date = "2024-09-23"
main = "worker.js"

[assets]
directory = "dist"
binding = "ASSETS"
# run_worker_first = true means every request goes through worker.js before
# static-asset routing, which is required for Accept: text/markdown
# content negotiation on the same URL as the HTML page.
run_worker_first = true

[build]
# build.js copies repo → dist/. IndexNow is NOT called here: the build runs before
# the new version is live, so engines could be sent to files that don't exist yet.
# The cited-episode-publish process notifies IndexNow after a publish is confirmed
# live (changed and new pages only). For other edits, run scripts/indexnow-submit.js
# by hand with the changed page URLs once they are live.
command = "node build.js"
