name: Build Monitor

on:
  schedule:
    # Run daily at 9:00 AM UTC — after the overnight stats commit window
    - cron: '0 9 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  check-cloudflare-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check latest Cloudflare Workers build on main
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.checks.listForRef({
              owner: 'ringmaster23',
              repo:  'cited',
              ref:   'main',
              check_name: 'Workers Builds: cited',
              per_page: 1,
              filter: 'latest',
            });

            if (!data.check_runs.length) {
              core.warning('No "Workers Builds: cited" check run found on main.');
              return;
            }

            const run  = data.check_runs[0];
            const sha  = run.head_sha.slice(0, 8);
            const url  = run.details_url || run.html_url;
            const conc = run.conclusion;

            if (run.status !== 'completed') {
              core.warning(`Build ${sha} still in progress (status: ${run.status}).`);
              return;
            }

            if (conc === 'success') {
              console.log(`✅ Build ${sha} succeeded — citedconversations.com is current.`);
            } else {
              // Fail the workflow so GitHub sends an email/notification to repo watchers.
              core.setFailed(
                `🚨 Workers Build FAILED on main.\n` +
                `Commit: ${sha}\n` +
                `Conclusion: ${conc}\n` +
                `Build log: ${url}\n\n` +
                `The live site is stuck on the last successful deploy. ` +
                `Fix the build gate failure before the next stats commit lands.`
              );
            }
