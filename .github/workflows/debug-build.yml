name: Debug Build v2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  debug-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Run build and capture output
        id: build
        run: |
          node build.js > build-output.txt 2>&1 || true
          echo "Build done. Output:"
          cat build-output.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build-output.txt
