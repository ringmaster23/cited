      "name": "How do you find out what buying intent your content should target?",
      "startOffset": 248,
      "endOffset": 501,
      "url": "https://podcast.citedconversations.com/episodes/best-agency-to-get-my-brand-cited-by-chatgpt-casey-cheshire-and-simon-wilhelm?t=271",

      "partOfEpisode": {
        "@id": "https://citedconversations.com/answers/best-agency-to-get-my-brand-cited-by-chatgpt/#episode"

    },
    {
      "@type": "Quotation",
      "@id": "https://citedconversations.com/answers/best-agency-to-get-my-brand-cited-by-chatgpt/#q3-quotation",
      "text": "Three steps how you can find out the buying intent or like, the whole intent across the customer journey. Social listening. You go on Reddit, Quora, YouTube comments, TikTok, Instagram, &#8230; and scrape these platforms for the questions that people ask there around your topic along the customer journey. And then you find the seed keywords and find more and more long-tail keywords. … Second one, is to go and ask your customer success and sales team, what are the most frequently asked questions that we getting? &#8230; And then the third one is that you extract your Google Search Console, GA4, and &#8230; Bing Webmaster tool data.",

      "name": "Why does the intent of the buying persona matter for showing up in AI search?",
      "startOffset": 503,
      "endOffset": 670,
      "url": "https://podcast.citedconversations.com/episodes/best-agency-to-get-my-brand-cited-by-chatgpt-casey-cheshire-and-simon-wilhelm?t=515",
      "creativeWorkStatus": "Published",
      "partOfEpisode": {
        "@id": "https://citedconversations.com/answers/best-agency-to-get-my-brand-cited-by-chatgpt/#episode"
      }
    },
    {
      "@type": "Quotation",
      "@id": "https://citedconversations.com/answers/best-agency-to-get-my-brand-cited-by-chatgpt/#q4-quotation",
      "text": "Because LLMs search context-based. Every one of us has their own context in their LLM. So you use ChatGPT, it saves the context about you, about your work, who you are, where you lived, where you live, what you have, what kind of preferences you have, and matches this when doing a search for you, what matches you best. So when you look for a product, we both look for a TV, will both of us give us different answers, and that has to do with the intent because the intent for you to buy a TV is different than for me when I buy a TV.",

        "@id": "https://citedconversations.com/speakers/simon-wilhelm/#speaker"

      "relatedLink": [],
      "creativeWorkStatus": "Published"
    },
    {

      "name": "What is the difference between SEO and AEO in plain terms?",
      "startOffset": 671,
      "endOffset": 779,
      "url": "https://podcast.citedconversations.com/episodes/best-agency-to-get-my-brand-cited-by-chatgpt-casey-cheshire-and-simon-wilhelm?t=704",
      "creativeWorkStatus": "Published",
      "partOfEpisode": {
        "@id": "https://citedconversations.com/answers/best-agency-to-get-my-brand-cited-by-chatgpt/#episode"
      }
    },
    {
      "@type": "Quotation",
      "@id": "https://citedconversations.com/answers/best-agency-to-get-my-brand-cited-by-chatgpt/#q5-quotation",
      "text": "SEO is optimizing for also technical readability of your website and optimizing to rank high for certain keywords. And AEO is really understanding the intent of your customer that can be super different and based on the persona and the location and the context within the LLM and all the search engines work differently. ChatGPT has its own index. Perplexity searches on the web. Claude is searching through Brave. And in traditional SEO, you were mostly targeting only Google and only focusing on one algorithm. Now you're focusing a lot of different algorithms and a lot of different personas.",
      "spokenByCharacter": {
        "@id": "https://citedconversations.com/speakers/simon-wilhelm/#speaker"

      "creator": {
        "@id": "https://citedconversations.com/speakers/simon-wilhelm/#speaker"

      "citation": "https://podcast.citedconversations.com/episodes/best-agency-to-get-my-brand-cited-by-chatgpt-casey-cheshire-and-simon-wilhelm?t=690",
      "relatedLink": [],
      "creativeWorkStatus": "Published"
    },
    {
      "@type": "Clip",
      "@id": "https://citedconversations.com/answers/best-agency-to-get-my-brand-cited-by-chatgpt/#q6-clip",
      "name": "Is good SEO enough, or does a brand need to do AEO as a separate step?",
      "startOffset": 782,
      "endOffset": 841,
      "url": "https://podcast.citedconversations.com/episodes/best-agency-to-get-my-brand-cited-by-chatgpt-casey-cheshire-and-simon-wilhelm?t=782",
      "creativeWorkStatus": "Published",
      "partOfEpisode": {
        "@id": "https://citedconversations.com/answers/best-agency-to-get-my-brand-cited-by-chatgpt/#episode"
      }
    },
    {
      "@type": "Quotation",
      "@id": "https://citedconversations.com/answers/best-agency-to-get-my-brand-cited-by-chatgpt/#q6-quotation",
      "text": "That's absolutely correct. &hellip; Yes, you can. Like, uh, doing good SEO is already 70% of it. &#8230; And AEO then is, if you now again look at larger enterprises, is something that is cross-functional. It goes across different divisions. … you have to start talking to customer success, to sales. And you have then to talk to product to understand how to answer these questions. With SEO, it was a lot easier because you were mostly focused on, like, the technical optimization. Now you have to talk to everyone in the organization to actually understand and orchestrate the efforts to become visible for a lot of different intents.</p>
